version: '3.0'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: vti_dtn2509_mng_spring
    ports:
      - "3307:3306"
    volumes:
      - mysql_local_data:/var/lib/mysql

volumes:
  mysql_local_data: